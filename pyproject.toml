[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spot-ai-mcp"
dynamic = ["version"]
description = "Unofficial community MCP server for the Spot AI camera and video-intelligence REST API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Phil Bryant" }]
keywords = ["mcp", "model-context-protocol", "spot-ai", "cameras", "video-intelligence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/phil-bryant/spot-ai-mcp"
Repository = "https://github.com/phil-bryant/spot-ai-mcp"

[project.scripts]
spot-ai-mcp = "spot_ai_mcp.server:main"

[tool.hatch.version]
path = "spot_ai_mcp/server.py"
